global:
  seed: 12345
  addr_num: 100
  zipf_skew: 0.6
contracts:
  - name: SmallBank
    weight: 0
    abi_path: "./contracts/SmallBank/small_bank_sol_SmallBank.abi"
    bin_path: "./contracts/SmallBank/small_bank_sol_SmallBank.bin"
    source_path: "./contracts/SmallBank/small_bank.sol"
    storage_layout_path: "./contracts/SmallBank/SmallBank.storage.json"
    functions:
      - name: almagate
        args: 2
        arg_mapping:
          arg0: addr1
          arg1: addr2
      - name: getBalance
        args: 1
        arg_mapping:
          arg0: addr1
      - name: updateBalance
        args: 2
        arg_mapping:
          arg0: addr1
        fixed_args:
          arg1: 100
      - name: updateSaving
        args: 2
        arg_mapping:
          arg0: addr1
        fixed_args:
          arg1: 100
      - name: sendPayment
        args: 3
        arg_mapping:
          arg0: addr1
          arg1: addr2
        fixed_args:
          arg2: 25
      - name: writeCheck
        args: 2
        arg_mapping:
          arg0: addr1
        fixed_args:
          arg1: 20
  - name: USDT
    weight: 0
    abi_path: "./contracts/USDT/USDT.abi"
    bin_path: "./contracts/USDT/USDT.bin"
    source_path: "./contracts/USDT/usdt.sol"
    storage_layout_path: "./contracts/USDT/USDT.storage.json"
    functions:
      - name: setAccount
        args: 2
        arg_mapping:
          arg0: addr1
        fixed_args:
          arg1: 100000
      - name: addBlackList
        args: 1
        arg_mapping:
          arg0: addr1
      - name: transfer
        args: 3
        arg_mapping:
          arg0: addr1
          arg1: addr2
        fixed_args:
          arg2: 100
  - name: DexRouter
    weight: 1
    abi_path: "./contracts/DexRouter/DexRouter.abi"
    bin_path: "./contracts/DexRouter/DexRouter.bin"
    source_path: "./contracts/DexRouter/DexRouter.sol"
    dependencies:
      - contract: USDT
        inject_as: constructor
        param_name: _usdtAddr
    storage_layout_path: "./contracts/DexRouter/DexRouter.storage.json"
    functions:
      # 用于在预热阶段给测试用户发钱
      - name: initAccount
        args: 2
        arg_mapping:
          arg0: addr1
        fixed_args:
          arg1: 100000
      # 用于在预热阶段初始化资金池
      - name: initPool
        args: 2
        arg_mapping:
          arg0: addr1 
        fixed_args:
          arg1: 1000
      # 压测阶段的高并发冲突目标函数
      - name: swap
        args: 3
        arg_mapping:
          arg0: addr1      # 动态参数：随机选取压测用户]
          arg1: addr2      # 动态参数：随机选取压测用户
        fixed_args:
          arg2: 100        # 固定参数：每次交换 100 的金额